[project]
name = "apptainer"
version = "0.0"
requires-python = ">=3.12"
dependencies = [
    "ops ~= 3.8",
    "charmed-hpc-libs ~= 0.7",
    "charmed-slurm-oci-runtime-interface ~= 1.0",
    "charmed-slurm-slurmctld-interface ~= 0.1",
]

[project.optional-dependencies]
dev = [
    # Testing
    "coverage[toml] ~= 7.15",
    "ops[testing] ~= 3.8",
    "pytest~=9.1",
    "pytest-mock ~= 3.15",
    "pytest-jubilant-bdd ~= 0.9",

    # Linting
    "ruff",
    "codespell",
    "pyright",
]

# Testing tools configuration
[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
minversion = "6.0"
log_cli_level = "INFO"

# Linting tools configuration
[tool.ruff]
line-length = 99
lint.select = ["E", "W", "F", "C", "N", "D", "I001"]
lint.extend-ignore = [
    "D105",
    "D107",
    "D203",
    "D204",
    "D213",
    "D215",
    "D400",
    "D404",
    "D406",
    "D407",
    "D408",
    "D409",
    "D413",
]
extend-exclude = ["__pycache__", "*.egg_info"]
lint.per-file-ignores = {"tests/*" = ["D100","D101","D102","D103","D104"]}

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.codespell]
skip = "build,venv,icon.svg,.tox,.git,.mypy_cache,.ruff_cache,.coverage"

[tool.pyright]
include = ["src/**.py"]
