name: apptainer
summary: |
  Charmed operator for the Apptainer container runtime.
description: |
  This subordinate charm installs the `apptainer` package when integrated
  with a primary charm and removes the package from the system when the
  integration between the primary and subordinate charm is removed.

  Apptainer is installed by this charm from the upstream ppa
  located at https://ppa.launchpadcontent.net/apptainer/ppa/ubuntu.

  The charm is a core component of Charmed HPC. See the following how-to in
  Charmed HPC's documentation for more information:

  - [How to integrate with Apptainer](https://ubuntu.com/hpc/docs/latest/howto/integrate/integrate-with-apptainer/)

  For more information about Charmed HPC, view the
  [full documentation](https://ubuntu.com/hpc/docs/latest).
links:
  contact: https://matrix.to/#/#hpc:ubuntu.com
  documentation: https://ubuntu.com/hpc/docs/latest
  website: https://ubuntu.com/hpc
  source: https://github.com/canonical/apptainer-operator
  issues: https://github.com/canonical/apptainer-operator/issues

assumes:
  - juju

type: charm
platforms:
  ubuntu@26.04:amd64:

subordinate: true

provides:
  oci-runtime:
    interface: slurm-oci-runtime
requires:
  juju-info:
    interface: juju-info
    scope: container

parts:
  apptainer:
    source: .
    plugin: uv
    build-snaps:
      - astral-uv
  # Create a version file and pack it into the charm. This is dynamically generated
  # as part of the build process for a charm to ensure that the git revision of the
  # charm is always recorded in this version file.
  version-file:
    plugin: nil
    build-packages:
      - git
    override-build: |
      VERSION=$(git -C $CRAFT_PART_SRC/../../apptainer/src describe --always)
      echo "Setting version to $VERSION"
      echo $VERSION > $CRAFT_PART_INSTALL/version
    stage:
      - version
